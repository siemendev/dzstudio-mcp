name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: siemendev/dzstudio-collab-server
          path: collab-server
      - uses: actions/setup-go@v6
        with:
          go-version-file: collab-server/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DZCOLLAB_SOURCE: ${{ github.workspace }}/collab-server
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - name: The packed server answers an MCP handshake with its version
        run: |
          npm pack --silent
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/dzbot-dzstudio-mcp-*.tgz
          version=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          reply=$( (echo "$init"; sleep 3) | timeout 20 npx dzstudio-mcp | head -n 1)
          echo "$reply"
          echo "$reply" | grep -qF "\"serverInfo\":{\"name\":\"dzstudio-mcp\",\"version\":\"$version\"}"
  publish:
    needs: [lint, test, package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # A version already on npm is skipped, so only a raised version in package.json publishes
      - name: Publish a new version to npm and tag it
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "@dzbot/dzstudio-mcp@$version" version 2>/dev/null)" ]; then
            echo "@dzbot/dzstudio-mcp@$version is already on npm"
            exit 0
          fi
          npm ci
          npm publish --access public --provenance
          git tag "v$version"
          git push origin "v$version"
